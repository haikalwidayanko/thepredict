<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Predictor Hub">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- mark: rounded tile with a rising signal line -->
  <rect x="2" y="6" width="36" height="36" rx="10" fill="url(#mark)"/>
  <polyline points="10,32 17,24 23,28 30,15"
            fill="none" stroke="#ffffff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="15" r="3.4" fill="#ffffff"/>
  <circle cx="30" cy="15" r="1.5" fill="#15803d"/>

  <!-- wordmark: light fill, tuned for the app's dark sidebar background -->
  <text x="50" y="24" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#e2e8f0" letter-spacing="-0.3">Predictor</text>
  <text x="50" y="39" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="2.4">CRYPTO PERPETUAL</text>
</svg>
